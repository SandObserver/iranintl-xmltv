[project]
name = "iranintl-xmltv"
version = "1.0.0"
description = "XMLTV programme guide for Iran International"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-cov>=7",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "RUF", "I", "N", "PTH", "PL", "C4", "C90"]
ignore = ["PLR2004"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["generate.py", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov --cov-report=term-missing:skip-covered"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["generate"]
branch = true

[tool.coverage.report]
fail_under = 85
